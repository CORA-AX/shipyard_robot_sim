# Namespace and installed XML/map paths are supplied by navigation.launch.py.
map_server:
  ros__parameters:
    use_sim_time: true
    frame_id: map
    topic_name: /map
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.0
      use_astar: true
      allow_unknown: false
      use_final_approach_orientation: false
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    odom_topic: /<ns>/odom
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 30.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.08
      # RViz supplies a complete target pose: require position and heading.
      yaw_goal_tolerance: 0.05
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: -0.45
      min_vel_y: -0.40
      max_vel_x: 0.45
      max_vel_y: 0.40
      max_vel_theta: 1.0
      min_speed_xy: 0.25
      max_speed_xy: 0.50
      min_speed_theta: 0.50
      acc_lim_x: 0.7
      acc_lim_y: 0.7
      acc_lim_theta: 1.5
      decel_lim_x: -0.9
      decel_lim_y: -0.9
      decel_lim_theta: -2.0
      vx_samples: 11
      vy_samples: 11
      vtheta_samples: 9
      # With a 0.25 m/s gait floor, a long horizon makes near-goal
      # forward/backward samples alternate before the smoother can respond.
      sim_time: 0.5
      linear_granularity: 0.05
      angular_granularity: 0.05
      transform_tolerance: 0.30
      xy_goal_tolerance: 0.08
      trans_stopped_velocity: 0.12
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, ObstacleFootprint, PathDist, GoalDist, Twirling]
      # Keep unnecessary approach rotations expensive, but prioritize heading
      # strongly once RotateToGoal enters the final alignment window.
      RotateToGoal.scale: 128.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: 0.3
      ObstacleFootprint.scale: 0.1
      PathDist.scale: 24.0
      GoalDist.scale: 32.0
      Twirling.scale: 20.0
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: <ns>/base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.30
      resolution: 0.05
      track_unknown_space: true
      # Navfn plans a point path. Use a circumscribed global radius with gait
      # margin; the local controller checks the actual rectangular envelope.
      robot_radius: 0.65
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 2.0
        inflation_radius: 1.20
      always_send_full_costmap: true
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: <ns>/odom
      robot_base_frame: <ns>/base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      update_frequency: 10.0
      publish_frequency: 2.0
      transform_tolerance: 0.30
      track_unknown_space: true
      footprint: '[[0.40, 0.25], [0.40, -0.25], [-0.40, -0.25], [-0.40, 0.25]]'
      footprint_padding: 0.04
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 2.0
        inflation_radius: 1.20
      always_send_full_costmap: true
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: <ns>/base_link
    odom_topic: /<ns>/odom
    transform_tolerance: 0.30
    bt_loop_duration: 20
    default_server_timeout: 2000
    wait_for_service_timeout: 3000
    enable_groot_monitoring: false
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_follow_path_action_bt_node
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 50.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.45, 0.40, 1.0]
    min_velocity: [-0.45, -0.40, -1.0]
    max_accel: [0.7, 0.7, 1.5]
    max_decel: [-0.9, -0.9, -2.0]
    odom_topic: /<ns>/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.3
